# Auto-approve wilco -> ci sync PRs that are byte-identical copies of reviewed
# wilco code. wilco's sync-ci workflow opens them as valors-release-bot, which
# GitHub does not let approve its own PR, so each sync otherwise waits for a
# human (ci#31). The approval comes from github-actions[bot] (GITHUB_TOKEN), a
# different identity. Logic and conditions: .github/scripts/verify-sync-pr.sh.
#
# pull_request_target so the org app secrets are available. Safe: the PR head
# is never checked out or executed; the script is taken from the BASE branch
# and only reads blobs through the API. PR text reaches it via env only.
name: Sync PR auto-approve

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  verify-and-approve:
    if: >-
      github.event.pull_request.user.login == 'valors-release-bot[bot]' &&
      github.event.pull_request.head.ref == 'sync/wilco-ci-review' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the BASE branch (never the PR head)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: App token to read wilco
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Verify byte-identical to wilco, then approve
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          WILCO_REPO: ${{ github.repository_owner }}/wilco
          READ_TOKEN: ${{ steps.app-token.outputs.token }}
          APPROVE_TOKEN: ${{ github.token }}
        run: bash .github/scripts/verify-sync-pr.sh
