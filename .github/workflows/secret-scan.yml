# Reusable Secret Scan workflow
# Called by other rc-international repos via:
#   uses: rc-international/ci/.github/workflows/secret-scan.yml@main
# Caller template (copy it, do not retype): templates/secret-scan-caller.yml
#
# Runs the gitleaks BINARY (MIT) at a pinned release, sha256-verified. It does
# NOT use gitleaks/gitleaks-action: that action needs a paid license on org
# accounts. The org plan has no GitHub secret scanning, so this is the check.
#
# Scope per event (history is fetched in full so ranges resolve, but only the
# new commits are scanned):
#   pull_request -> base_sha..head_sha   (the PR's commits only)
#   push         -> before..after        (the pushed range)
#                   new branch (before = 000...) or force-push (before not in
#                   the clone) -> ALL history reachable from after. No commit is
#                   skipped on the claim that another branch already scanned it.
#   merge_group  -> merge_group.base_sha..head_sha  (the queue entry's commits)
#                   GitHub sets both shas on the event, and the full-history
#                   checkout resolves them. A missing or unresolvable sha fails
#                   the job: passing through on "the PR was scanned" would let a
#                   leak merge when the queue range holds commits the PR run did
#                   not see (an earlier queue entry, or a conflict fix). The
#                   caller must list `merge_group:` so a required check reports.
# A repo-level .gitleaks.toml and .gitleaksignore at the repo root are honoured
# when present. The report (JSON) is redacted (--redact) and uploaded as an
# artifact. The job log lists each finding (rule, file, line, commit, fingerprint)
# and writes one ::error annotation per finding. The secret value is never printed.
#
# To bump gitleaks: change GITLEAKS_VERSION and GITLEAKS_SHA256 together. Get the
# digest from the release's gitleaks_<ver>_checksums.txt (linux_x64 line). The
# step checks the tarball against BOTH this pinned digest and the release file.

name: Secret Scan

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label for the scan job."
        required: false
        type: string
        default: "ubuntu-latest"

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          dl="$RUNNER_TEMP/gitleaks-dl"
          mkdir -p "$dl"
          curl -fsSL --retry 3 --max-time 120 -o "$dl/$tarball" "$base/$tarball"
          curl -fsSL --retry 3 --max-time 120 -o "$dl/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          # Pinned digest in this file.
          echo "${GITLEAKS_SHA256}  $dl/$tarball" | sha256sum -c -
          # Digest from the release checksums file (must also match).
          grep "  ${tarball}\$" "$dl/checksums.txt" > "$dl/one.txt"
          [ "$(wc -l < "$dl/one.txt")" -eq 1 ] || { echo "::error::checksums file has no single entry for $tarball"; exit 1; }
          (cd "$dl" && sha256sum -c one.txt)
          tar -xzf "$dl/$tarball" -C "$dl" gitleaks
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "$dl/gitleaks" "$RUNNER_TEMP/bin/gitleaks"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gitleaks" version

      - name: Warn when the PR edits scanner config
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # A PR can allowlist its own finding by editing these files. Make the
          # edit visible so a reviewer looks at it.
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- .gitleaks.toml .gitleaksignore || true)"
          if [ -n "$changed" ]; then
            echo "::warning title=Secret-scan config changed::This PR edits: $(echo "$changed" | tr '\n' ' '). Review the allowlist changes."
          fi

      - name: Scan new commits for secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          PUSH_REF: ${{ github.ref }}
          MQ_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          zero="0000000000000000000000000000000000000000"

          case "$EVENT_NAME" in
            pull_request|pull_request_target)
              if [ -z "$PR_BASE_SHA" ] || [ -z "$PR_HEAD_SHA" ]; then
                echo "::error::missing PR base/head sha"; exit 1
              fi
              range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
              ;;
            push)
              [ -n "$PUSH_AFTER" ] || { echo "::error::missing push after sha"; exit 1; }
              if [ "$PUSH_AFTER" = "$zero" ]; then
                echo "Branch deletion: nothing to scan."; exit 0
              fi
              if [ "$PUSH_BEFORE" = "$zero" ] || ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                echo "New branch or rewritten history (before=${PUSH_BEFORE:0:12}): scanning all history reachable from the pushed tip."
                range="$PUSH_AFTER"
              else
                range="${PUSH_BEFORE}..${PUSH_AFTER}"
              fi
              ;;
            merge_group)
              if [ -z "$MQ_BASE_SHA" ] || [ -z "$MQ_HEAD_SHA" ]; then
                echo "::error::missing merge_group base/head sha"; exit 1
              fi
              for s in "$MQ_BASE_SHA" "$MQ_HEAD_SHA"; do
                git cat-file -e "${s}^{commit}" 2>/dev/null \
                  || { echo "::error::merge_group sha ${s:0:12} is not in the clone; refusing to skip the scan"; exit 1; }
              done
              range="${MQ_BASE_SHA}..${MQ_HEAD_SHA}"
              ;;
            *)
              echo "::error::secret-scan supports pull_request, push and merge_group only (got $EVENT_NAME)"; exit 1
              ;;
          esac

          echo "Scanning git range: $range"
          read -r -a range_words <<< "$range"
          count="$(git rev-list --count "${range_words[@]}")"
          echo "Commits in range: $count"
          if [ "$count" -eq 0 ]; then echo "Nothing to scan."; exit 0; fi

          args=(git . --log-opts="$range" --redact --exit-code 1 --no-color --no-banner
                --report-format json --report-path "$RUNNER_TEMP/gitleaks.json")
          # Repo-level config and ignore file, when present at the repo root.
          if [ -f .gitleaks.toml ]; then args+=(--config .gitleaks.toml); echo "Using .gitleaks.toml"; fi
          if [ -f .gitleaksignore ]; then args+=(--gitleaks-ignore-path .gitleaksignore); echo "Using .gitleaksignore"; fi

          # gitleaks exits 0 with "no leaks found" even when the underlying git
          # log failed (it only logs an ERR line). Fail closed on any ERR line.
          # pipefail makes the pipeline status gitleaks' own status (tee succeeds).
          rc=0
          gitleaks "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/gitleaks.log" || rc=$?
          if grep -qE '(^|[[:space:]])ERR[[:space:]]' "$RUNNER_TEMP/gitleaks.log"; then
            echo "::error::gitleaks logged an error; refusing to treat the scan as clean"
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            report="$RUNNER_TEMP/gitleaks.json"
            # Print identifying fields only. Secret and Match are never read.
            # Annotation values escape % CR LF (data) and also : , (properties).
            if [ -s "$report" ] && jq -e 'type == "array"' "$report" >/dev/null 2>&1; then
              echo "Findings (secret values are never printed):"
              jq -r '.[] | "  rule=\(.RuleID) file=\(.File) line=\(.StartLine) commit=\(.Commit) fingerprint=\(.Fingerprint)"' "$report"
              jq -r '
                def esc: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
                def prop: esc | gsub(":"; "%3A") | gsub(","; "%2C");
                .[] | "::error file=\(.File | prop),line=\(.StartLine),title=\("Secret detected: " + .RuleID | prop)::\("commit " + .Commit[0:12] + " fingerprint " + .Fingerprint | esc)"
              ' "$report"
            else
              echo "::warning::gitleaks reported a failure but no readable JSON report; findings cannot be listed"
            fi
          fi
          exit "$rc"

      - name: Upload redacted report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks.json
          if-no-files-found: ignore
          retention-days: 14
