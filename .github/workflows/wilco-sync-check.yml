# Drift check: the review scripts in this repo must equal rc-international/wilco main.
# wilco is the source (scripts/sync-ci.sh publishes the copies here). Compares this PR's
# files with wilco `main` at run time, so a ci PR that carries a gate change is red until the
# matching wilco PR has merged. Merge the wilco change first.
# Fails closed: an unreadable side is drift.
# The wilco checkout uses the release app token, scoped to wilco. If the app cannot read wilco,
# the checkout step fails and so does this check (nothing passes unread).

name: Wilco sync check

on:
  pull_request:
    paths:
      - scripts/ci-review.ts
      - scripts/lib/**
      - .github/scripts/check-wilco-sync.ts
      - .github/workflows/wilco-sync-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create wilco read token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: wilco

      - name: Checkout ci
        uses: actions/checkout@v4

      - name: Checkout wilco main
        uses: actions/checkout@v4
        with:
          repository: rc-international/wilco
          ref: main
          path: .wilco
          token: ${{ steps.app-token.outputs.token }}
          sparse-checkout: |
            scripts/ci-review.ts
            scripts/lib/
            rules/terse-briefings.md

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Compare copies
        run: bun .github/scripts/check-wilco-sync.ts .wilco .
