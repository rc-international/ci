# Reusable Tailscale deploy workflow — rc-international standard.
#
# Standardizes deployment across the org: the runner joins the tailnet with a
# Tailscale auth key, then SSHes to each host. Auth is handled by **Tailscale
# SSH** (the tailnet ACL governs which tag:ci -> host/user connections are
# allowed), so there are NO SSH deploy keys, no ssh-agent, and no known_hosts
# management.
#
# It:
#   (a) joins the tailnet (tailscale/github-action@v2) using secrets.TS_AUTHKEY;
#   (b) fans out over a caller-supplied HOST MATRIX (JSON array; each entry:
#       name, ssh_host, ssh_user, ssh_port); and
#   (c) runs the caller-provided remote_script on each host over Tailscale SSH,
#       failing the job if ANY host fails.
#
# Callers pass the matrix + remote_script as inputs and TS_AUTHKEY as a secret.

name: Reusable Tailscale Deploy

on:
  workflow_call:
    inputs:
      hosts:
        description: >-
          JSON array of host objects. Each entry:
            {"name":"<label>","ssh_host":"<tailnet-ip-or-magicdns>",
             "ssh_user":"<user>","ssh_port":"<port>"}
        required: true
        type: string
      remote_script:
        description: >-
          The deploy script to execute ON each remote host over Tailscale SSH.
          Runs under `bash -s` as the matrix entry's ssh_user (sudo/root
          capable). It receives FORCE and HOST_NAME in its environment.
        required: true
        type: string
      force:
        description: "Redeploy even if the host is already on origin/main."
        required: false
        type: boolean
        default: false
      max_parallel:
        description: >-
          Max hosts to deploy concurrently. Default 1 = serialized rollout
          (safer: a bad build stops at the first host).
        required: false
        type: number
        default: 1
      runs_on:
        description: "Runner label for the deploy job."
        required: false
        type: string
        default: "ubuntu-latest"
    secrets:
      TS_AUTHKEY:
        description: "Tailscale auth key (tagged tag:ci, ephemeral) for the runner to join the tailnet."
        required: true

concurrency:
  group: deploy-tailscale-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ${{ inputs.runs_on }}
    strategy:
      # Report every host; do not cancel siblings when one fails. The final
      # per-host non-zero exit still fails the overall job.
      fail-fast: false
      max-parallel: ${{ inputs.max_parallel }}
      matrix:
        host: ${{ fromJSON(inputs.hosts) }}
    env:
      SSH_HOST: ${{ matrix.host.ssh_host }}
      SSH_USER: ${{ matrix.host.ssh_user }}
      SSH_PORT: ${{ matrix.host.ssh_port }}
      HOST_NAME: ${{ matrix.host.name }}
      FORCE: ${{ inputs.force }}
    steps:
      - name: Validate host entry
        run: |
          set -euo pipefail
          : "${SSH_HOST:?host matrix entry missing ssh_host}"
          : "${SSH_USER:?host matrix entry missing ssh_user}"
          echo "Host '${HOST_NAME}' -> ${SSH_USER}@${SSH_HOST}:${SSH_PORT:-22}"

      - name: Join tailnet
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Deploy to ${{ matrix.host.name }}
        env:
          # The caller's remote script, verbatim. Passed via env so it is not
          # re-expanded on the runner.
          REMOTE_SCRIPT: ${{ inputs.remote_script }}
        run: |
          set -euo pipefail
          # Materialize the caller script to a temp file (prefixed with the
          # error-fail shell opts) and feed it to remote `bash -s` over stdin.
          # `printf '%s'` prints the script literally, so every $VAR / $(...) in
          # it is evaluated on the HOST (shellcheck SC2087). FORCE + HOST_NAME
          # are injected as `printf %q` bash-escaped `export` lines so a hostile
          # matrix value can't break out and run code on the target.
          # Tailscale SSH authenticates the connection — no keys, no known_hosts.
          script_file="$(mktemp)"
          trap 'rm -f "$script_file"' EXIT
          {
            printf '%s\n' 'set -euo pipefail'
            printf 'export FORCE=%q\n' "${FORCE:-false}"
            printf 'export HOST_NAME=%q\n' "${HOST_NAME}"
            printf '%s\n' "$REMOTE_SCRIPT"
          } > "$script_file"
          # `--` guards against an ssh_user beginning with '-' being parsed as an
          # ssh option (option-injection on the runner).
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            -p "${SSH_PORT:-22}" -- "${SSH_USER}@${SSH_HOST}" \
            "bash -s" < "$script_file"
