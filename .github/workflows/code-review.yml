# Reusable Code Review workflow
# Called by other rc-international repos via:
#   uses: rc-international/ci/.github/workflows/code-review.yml@main
#   secrets: inherit
#
# Submits reviews as valors-release-bot (via the RELEASE_APP_ID/PRIVATE_KEY org
# secrets) so that APPROVE reviews count toward the required-approving-review
# count in branch protection. GITHUB_TOKEN-submitted reviews are explicitly
# excluded by GitHub from satisfying the review requirement.

name: Code Review

on:
  workflow_call:
    # Optional comment-context inputs. Callers that trigger this reusable on an
    # `issue_comment` event pass these so the manual `approved`-comment fallback
    # (used when the Cerebras automated review is unavailable) can run. Callers
    # that don't pass them keep the existing `pull_request` behavior exactly:
    # the defaults below leave GITHUB_EVENT_NAME empty, so ci-review.ts's
    # `getManualApprovalFromEnv()` returns null and the normal diff review runs.
    inputs:
      github_event_name:
        description: 'github.event_name of the caller (e.g. pull_request, issue_comment)'
        required: false
        type: string
        default: ''
      comment_body:
        description: 'Body of the triggering comment (issue_comment only)'
        required: false
        type: string
        default: ''
      comment_author:
        description: 'Login of the comment author (issue_comment only)'
        required: false
        type: string
        default: ''
      comment_author_association:
        description: 'Author association of the comment author (OWNER/MEMBER/...)'
        required: false
        type: string
        default: ''
      comment_is_pr:
        description: 'Whether the issue_comment is on a PR ("true"/"false")'
        required: false
        type: string
        default: 'false'
      pr_number:
        description: 'PR number to review/approve (defaults to pull_request number)'
        required: false
        type: string
        default: ''
    secrets:
      CEREBRAS_API_KEY:
        required: true
      RELEASE_APP_ID:
        required: true
      RELEASE_APP_PRIVATE_KEY:
        required: true

permissions:
  pull-requests: write
  contents: read

jobs:
  code-review:
    runs-on: ubuntu-latest
    steps:
      # Skip LLM review on dependabot PRs. Dependabot PRs run in a reduced-
      # permission context that can't read org Actions secrets (CEREBRAS_API_KEY,
      # RELEASE_APP_ID/PRIVATE_KEY), so the workflow startup-fails. Even if we
      # mirrored the secrets, LLM-reviewing a machine-generated version or
      # security bump adds no signal beyond GitHub's advisory DB — the diff is
      # always a version string + lockfile churn.
      #
      # The skip is per-step (not job-level) so the job still completes with
      # SUCCESS rather than SKIPPED. A SKIPPED required check counts as
      # not-passing in branch protection and would block dependabot PRs.
      - name: Skip notice (dependabot)
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: echo "Skipping LLM code review for dependabot PR."

      - name: Generate app token
        id: app-token
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout calling repo
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Checkout CI scripts
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: actions/checkout@v4
        with:
          repository: rc-international/ci
          path: .ci
          sparse-checkout: |
            scripts/ci-review.ts
            scripts/lib/
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Bun
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run CI code review
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr_number != '' && inputs.pr_number || github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Comment-context passthrough for the manual `approved`-comment fallback.
          # When the caller triggers on `pull_request`, these are empty/defaulted,
          # so ci-review.ts runs its normal diff review. When the caller triggers
          # on `issue_comment`, these route to getManualApprovalFromEnv().
          GITHUB_EVENT_NAME: ${{ inputs.github_event_name }}
          COMMENT_BODY: ${{ inputs.comment_body }}
          COMMENT_AUTHOR: ${{ inputs.comment_author }}
          COMMENT_AUTHOR_ASSOCIATION: ${{ inputs.comment_author_association }}
          COMMENT_IS_PR: ${{ inputs.comment_is_pr }}
        run: bun .ci/scripts/ci-review.ts
