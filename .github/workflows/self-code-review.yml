# Self code-review — runs ci's OWN reusable code-review on ci's OWN PRs.
#
# ci hosts the reusable code-review.yml (on: workflow_call) that every consumer
# repo calls, but had no caller for itself — so ci's own PRs never got the
# valors-release-bot APPROVE that satisfies branch protection (they sat at
# REVIEW_REQUIRED). This is the missing self-caller.
#
# It references the LOCAL reusable workflows (`./…`) rather than @main so that a
# change to the reviewer is exercised on the same PR that changes it.
name: Self Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  review:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/code-review.yml
    secrets: inherit
  # Manual `approved`-comment fallback. On an issue_comment event ci-review.ts
  # runs ONLY the manual-approve check (it exits before any diff/API review), so
  # no paid review is spent here — the phrase match happens in ci-review.ts. We
  # only guard that the comment is on a PR (not a plain issue) before forwarding.
  approve-comment:
    # Bot-authored PRs are handled by approve-bot-authored below: the bot cannot
    # approve its own PR, so this path could only post a COMMENT there (ci#31).
    if: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.issue.user.login != 'valors-release-bot[bot]' }}
    uses: ./.github/workflows/code-review.yml
    secrets: inherit
    with:
      github_event_name: ${{ github.event_name }}
      comment_body: ${{ github.event.comment.body }}
      comment_author: ${{ github.event.comment.user.login }}
      comment_author_association: ${{ github.event.comment.author_association }}
      comment_is_pr: ${{ 'true' }}
      pr_number: ${{ github.event.issue.number }}
  dependabot-approve:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.user.login == 'dependabot[bot]'
    uses: ./.github/workflows/dependabot-approve.yml
    secrets: inherit
  # `approved` comment on a PR the bot itself opened (the wilco -> ci sync PRs).
  # GitHub does not let valors-release-bot approve its own PR, so the comment
  # path above could only leave a COMMENT and a human had to submit a formal
  # review by hand (ci#31, 2026-10-09). Here the HUMAN's comment is still the
  # gate (same rule as ci-review.ts: trimmed, case-insensitive `approved`, from an
  # OWNER/MEMBER); the approval is just recorded by github-actions[bot], a
  # different identity. Nothing from the PR is checked out or executed.
  approve-bot-authored:
    if: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.issue.user.login == 'valors-release-bot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Approve on a trusted `approved` comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          set -euo pipefail
          body=$(printf '%s' "$COMMENT_BODY" | tr '[:upper:]' '[:lower:]' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [ "$body" != approved ]; then
            echo "Comment is not an approval; nothing to do."
            exit 0
          fi
          case "$ASSOCIATION" in
            OWNER|MEMBER) ;;
            *) echo "::warning::'approved' from $COMMENT_AUTHOR ($ASSOCIATION) ignored: only OWNER/MEMBER may approve."; exit 0 ;;
          esac
          head=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)
          jq -n --arg sha "$head" --arg body "Approved on behalf of @$COMMENT_AUTHOR ($ASSOCIATION), who commented \`approved\`. Recorded by github-actions[bot] because valors-release-bot cannot approve its own PR." \
            '{event: "APPROVE", commit_id: $sha, body: $body}' |
            gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --method POST --input - >/dev/null
          echo "Approved PR #$PR_NUMBER at ${head:0:12} for $COMMENT_AUTHOR."
