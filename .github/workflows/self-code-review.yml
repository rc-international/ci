# Self code-review — runs ci's OWN reusable code-review on ci's OWN PRs.
#
# ci hosts the reusable code-review.yml (on: workflow_call) that every consumer
# repo calls, but had no caller for itself — so ci's own PRs never got the
# valors-release-bot APPROVE that satisfies branch protection (they sat at
# REVIEW_REQUIRED). This is the missing self-caller.
#
# It references the LOCAL reusable workflows (`./…`) rather than @main so that a
# change to the reviewer is exercised on the same PR that changes it.
name: Self Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  review:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/code-review.yml
    secrets: inherit
  # Manual `approved`-comment fallback. On an issue_comment event ci-review.ts
  # runs ONLY the manual-approve check (it exits before any diff/API review), so
  # no paid review is spent here — the phrase match happens in ci-review.ts. We
  # only guard that the comment is on a PR (not a plain issue) before forwarding.
  approve-comment:
    # Bot-authored PRs are handled by approve-bot-authored below: the bot cannot
    # approve its own PR, so this path could only post a COMMENT there (ci#31).
    if: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.issue.user.login != 'valors-release-bot[bot]' }}
    uses: ./.github/workflows/code-review.yml
    secrets: inherit
    with:
      github_event_name: ${{ github.event_name }}
      comment_body: ${{ github.event.comment.body }}
      comment_author: ${{ github.event.comment.user.login }}
      comment_author_association: ${{ github.event.comment.author_association }}
      comment_is_pr: ${{ 'true' }}
      pr_number: ${{ github.event.issue.number }}
  dependabot-approve:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.user.login == 'dependabot[bot]'
    uses: ./.github/workflows/dependabot-approve.yml
    secrets: inherit
  # `approved <sha>` comment on a PR the bot itself opened (the wilco -> ci sync
  # PRs). GitHub does not let valors-release-bot approve its own PR, so the
  # comment path above could only leave a COMMENT and a human had to submit a
  # formal review by hand (ci#31, 2026-10-09). The HUMAN's comment stays the
  # gate (OWNER/MEMBER, same rule as ci-review.ts); github-actions[bot] only
  # records it. The comment must name the head commit it approves
  # (`approved <7+ hex>`): the job runs after the comment, and a push in between
  # (e.g. the daily sync rebuild) must never be approved unseen. A bare
  # `approved` gets a reply with the exact command. Only the sync branch from
  # this repo qualifies. Nothing from the PR is checked out or executed.
  approve-bot-authored:
    if: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.issue.user.login == 'valors-release-bot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      issues: write # the reply comment when the head is not named
    steps:
      - name: Approve on a trusted `approved <sha>` comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          set -euo pipefail
          body=$(printf '%s' "$COMMENT_BODY" | tr '[:upper:]' '[:lower:]' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          case "$body" in
            approved | "approved "*) ;;
            *) echo "Comment is not an approval; nothing to do."; exit 0 ;;
          esac
          case "$ASSOCIATION" in
            OWNER|MEMBER) ;;
            *) echo "::warning::'approved' from $COMMENT_AUTHOR ($ASSOCIATION) ignored: only OWNER/MEMBER may approve."; exit 0 ;;
          esac
          pr=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '[.head.sha, .head.ref, .head.repo.full_name] | @tsv')
          IFS=$'\t' read -r head ref head_repo <<<"$pr"
          if [ "$ref" != sync/wilco-ci-review ] || [ "$head_repo" != "$REPO" ]; then
            echo "::warning::not the wilco sync branch of this repo ($head_repo:$ref); not approving."
            exit 0
          fi
          want=$(printf '%s' "$body" | sed -nE 's/^approved ([0-9a-f]{7,40})$/\1/p')
          if [ -z "$want" ] || [ "${head#"$want"}" = "$head" ]; then
            msg="Not approved: to approve, comment \`approved ${head:0:12}\` (the current head). The commit is named so a push between your comment and this job can never be approved unseen."
            if [ -n "$want" ]; then msg="Not approved: \`$want\` is not the current head (${head:0:12}); the PR changed. Review it, then comment \`approved ${head:0:12}\`."; fi
            jq -n --arg body "$msg" '{body: $body}' | gh api "repos/$REPO/issues/$PR_NUMBER/comments" --method POST --input - >/dev/null
            echo "$msg"
            exit 0
          fi
          jq -n --arg sha "$head" --arg body "Approved on behalf of @$COMMENT_AUTHOR ($ASSOCIATION), who commented \`approved ${want}\`. Recorded by github-actions[bot] because valors-release-bot cannot approve its own PR." \
            '{event: "APPROVE", commit_id: $sha, body: $body}' |
            gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --method POST --input - >/dev/null
          echo "Approved PR #$PR_NUMBER at ${head:0:12} for $COMMENT_AUTHOR."
