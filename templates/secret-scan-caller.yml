# TEMPLATE - copy this into a repo at .github/workflows/secret-scan.yml
# to scan new commits for secrets with gitleaks (pinned binary, MIT; NOT the paid gitleaks-action).
#
# ONBOARDING CHECKLIST for a repo:
#   1. Copy this file to <repo>/.github/workflows/secret-scan.yml on a branch and open a PR.
#      No secrets or variables are needed. The workflow uses only the default GITHUB_TOKEN
#      with contents: read.
#   2. Check the default branch name. If it is not `main`, edit `branches:` below.
#   3. (Optional) Add a repo-root `.gitleaks.toml` for custom rules or allowlists, and a
#      `.gitleaksignore` for single findings. The scan picks both up when present.
#        - Start .gitleaks.toml with:  [extend]  useDefault = true
#        - A finding prints a `Fingerprint`. Put that line in .gitleaksignore to accept one finding.
#        - A PR that edits either file gets a warning annotation. A reviewer must read the change.
#   4. Run a one-off full-history scan first (the PR check only sees new commits). Fix or
#      allowlist old findings. Rotate any real secret: deleting it from HEAD does not revoke it.
#   5. Make the check required. In branch protection (or the ruleset) for the default branch,
#      add the status check `scan / secret-scan`. The name is <caller job id> / <reusable job id>.
#
# SCOPE: pull_request scans base..head. push to the default branch scans before..after. A new
# branch or a force-push scans all history reachable from the pushed tip.
#
# The report (SARIF, redacted) is uploaded as the artifact `gitleaks-report`.
# Pinning: this calls @main. To pin, use a ci commit SHA instead of @main.

name: Secret Scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    permissions:
      contents: read
    uses: rc-international/ci/.github/workflows/secret-scan.yml@main
    # with:
    #   runs_on: ubuntu-latest   # default
